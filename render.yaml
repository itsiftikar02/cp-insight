# Render Blueprint — defines the whole CP Insight stack as code.
# Render reads this file and creates the database + two web services for you.
# All three use the free instance type (see render.com/docs/free for limits).

databases:
  - name: cpinsight-db
    databaseName: cpinsight
    user: cpuser
    plan: free

services:
  # ---- Django backend (API) ------------------------------------------------
  - type: web
    name: cpinsight-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cpinsight-db
          property: connectionString

  # ---- Streamlit dashboard -------------------------------------------------
  - type: web
    name: cpinsight-dashboard
    runtime: docker
    rootDir: dashboard
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Point the dashboard at the backend's public URL.
      - key: API_BASE
        value: https://cpinsight-backend.onrender.com/api
